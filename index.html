<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nada Aqui</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        background: linear-gradient(180deg,#111,#1d1d1d);
        color:#fff;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        text-align:center;
        padding:20px;
    }

    .container{
        width:100%;
        max-width:400px;
    }

    h1{
        font-size:2rem;
        margin-bottom:15px;
    }

    p{
        font-size:1.1rem;
        color:#cfcfcf;
        line-height:1.6;
    }

    .emoji{
        font-size:4rem;
        margin-bottom:20px;
    }

    @media (max-width:480px){
        h1{
            font-size:1.8rem;
        }

        p{
            font-size:1rem;
        }
    }
</style>
</head>
<body>

<div class="container">
    <div class="emoji">👀</div>
    <h1>Não tem nada aqui...</h1>
    <p>Você está olhando no lugar errado.<br>
    Procure nos outros.</p>
</div>

</body>
</html>
